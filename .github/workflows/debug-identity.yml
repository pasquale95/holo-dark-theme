# THROWAWAY: validates that the publish job's Environment-based federated
# credential logs in. Run once via "Run workflow", then delete this file.
name: Debug Identity
on:
  workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: az account show --query "{name:name,user:user.name}" -o json
