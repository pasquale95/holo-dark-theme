---
# ==========================
# Test comment
# ==========================
my_servers:
  vars:
    my_use_tls: true
    my_name: "{{ inventory_hostname }}"
    my_admin:
      name: admin
      secret: adminPWD
      attrs:
        hf.Registrar.Roles: "*"
        hf.GenCRL: "true"
  hosts:
    - host1
    - host2

- name: Install packages
  hosts: all
  become: true
  vars:
    pkg_list: "{{ base_packages + extra_packages }}"
  tasks:
    - name: Ensure dir
      ansible.builtin.file:
        path: /opt/{{ app_name }}
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"
      loop: "{{ items | default([]) }}"
      register: result
      notify: restart svc
      tags: [setup, files]
    - name: Debug
      ansible.builtin.debug:
        msg: >-
          Value is {{ result.stdout | trim }}
    - name: Apply loadgen NodePort service
      kubernetes.core.k8s:
        state: present
      when:
        - loadgen_k8s_metrics_node_port is defined or
          loadgen_k8s_rpc_node_port is defined
